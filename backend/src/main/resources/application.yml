server:
  port: 8080

spring:
  application:
    name: nobodies-platform-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:13306/nobodies?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:mysql123456}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS_ENABLE:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html

jwt:
  secret: ${JWT_SECRET:replace_with_a_long_secure_secret_key_32_chars_minimum}
  expiration-seconds: ${JWT_EXPIRATION_SECONDS:7200}

aliyun:
  oss:
    endpoint: ${OSS_ENDPOINT:https://oss-cn-hangzhou-internal.aliyuncs.com}
    access-key-id: ${OSS_ACCESS_KEY_ID:}
    access-key-secret: ${OSS_ACCESS_KEY_SECRET:}
    bucket: ${OSS_BUCKET:platform-eng-1}
    presign-duration-minutes: ${OSS_PRESIGN_DURATION_MINUTES:30}

auth:
  rate-limit:
    window-seconds: ${AUTH_RATE_LIMIT_WINDOW_SECONDS:60}
    max-requests: ${AUTH_RATE_LIMIT_MAX_REQUESTS:10}
  password-reset:
    token-expiration-minutes: ${AUTH_PASSWORD_RESET_TOKEN_EXPIRATION_MINUTES:30}

upload:
  max-file-size: ${UPLOAD_MAX_FILE_SIZE:1099511627776}
  allowed-types: ${UPLOAD_ALLOWED_TYPES:mp4,mov,avi,mkv}
  chunk-retry-times: ${UPLOAD_CHUNK_RETRY_TIMES:3}
  rate-limit:
    window-seconds: ${UPLOAD_RATE_LIMIT_WINDOW_SECONDS:60}
    max-requests: ${UPLOAD_RATE_LIMIT_MAX_REQUESTS:20}

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  frontend:
    reset-password-url: ${APP_FRONTEND_RESET_PASSWORD_URL:http://localhost:5173/reset-password}
  mail:
    from: ${APP_MAIL_FROM:noreply@nobodies.local}
