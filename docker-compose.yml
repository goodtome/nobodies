version: "3.9"

services:
  mysql:
    image: mysql:8.0
    container_name: nobodies-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: nobodies
    ports:
      - "3307:3306"
    command: --default-authentication-plugin=mysql_native_password
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p123456"]
      interval: 10s
      timeout: 5s
      retries: 10

  mailhog:
    image: mailhog/mailhog:latest
    container_name: nobodies-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "1025"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: nobodies-backend
    env_file:
      - ./.env
    environment:
      DB_URL: jdbc:mysql://mysql:3306/nobodies?useSSL=false&serverTimezone=UTC&characterEncoding=utf8
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD}
      MAIL_HOST: mailhog
      MAIL_PORT: 1025
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_SECONDS: ${JWT_EXPIRATION_SECONDS}
      OSS_ENDPOINT: ${OSS_ENDPOINT}
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET}
      OSS_BUCKET: ${OSS_BUCKET}
      OSS_PRESIGN_DURATION_MINUTES: ${OSS_PRESIGN_DURATION_MINUTES:-30}
      UPLOAD_MAX_FILE_SIZE: 1099511627776
      UPLOAD_ALLOWED_TYPES: mp4,mov,avi,mkv
      UPLOAD_CHUNK_RETRY_TIMES: 3
      APP_CORS_ALLOWED_ORIGINS: http://localhost,http://127.0.0.1,http://localhost:80,http://127.0.0.1:80
    depends_on:
      mysql:
        condition: service_healthy
      mailhog:
        condition: service_healthy
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
    container_name: nobodies-frontend
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  mysql_data:
